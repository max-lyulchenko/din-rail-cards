# Builds the cards for a published release and attaches din-rail-cards.js to
# it, where HACS downloads it from
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build with the version of the tag
        run: VERSION="${GITHUB_REF_NAME#v}" npm run build
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/din-rail-cards.js --clobber
